<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#dfe3e8;font-family:sans-serif;display:grid;place-items:center;min-height:100vh}.phone{width:390px;height:844px;background:#101722;color:#fff;position:relative;overflow:hidden;box-shadow:0 20px 60px #0006}.scene{position:absolute;inset:0;background:radial-gradient(circle at 70% 30%,#8f6d54,#101722 74%)}.top{position:absolute;z-index:2;left:0;right:0;top:0;padding:18px 16px;display:flex;justify-content:space-between;font-size:13px}.top button{background:none;border:0;color:#fff;font-size:22px}.hero{position:absolute;z-index:1;inset:150px 0 260px;display:grid;place-items:center}.avatar{width:138px;height:138px;border:3px solid #e3c88d;border-radius:50%;background:#b99b7f;display:grid;place-items:center;font-size:65px;color:#4b3527}.name{position:absolute;top:calc(50% + 87px);font-size:18px}.mini{position:absolute;z-index:3;right:14px;top:68px;width:78px;height:108px;border:1px solid #fff7;border-radius:10px;background:#34505f;display:grid;place-items:center;font-size:25px}.mini small{position:absolute;bottom:5px;font-size:9px}.dialog{position:absolute;z-index:3;left:16px;right:16px;bottom:155px;padding:14px 16px;border:1px solid #fff3;border-radius:14px;background:#101722d9}.speaker{font-size:12px;color:#e4c98d}.line{font-size:17px;line-height:1.65;min-height:54px}.hint{font-size:10px;color:#fff8;text-align:right}.controls{position:absolute;z-index:5;bottom:0;left:0;right:0;padding:16px 20px 24px;display:flex;justify-content:center;gap:24px;background:linear-gradient(transparent,#090e16)}.ctrl{width:50px;height:50px;border-radius:50%;border:1px solid #fff6;background:#fff3;color:#fff;font-size:20px}.hang{background:#df4d51;border:0;width:62px;height:62px}.incoming{position:absolute;z-index:8;top:12px;left:10px;right:10px;padding:10px 12px;border-radius:15px;background:#182331f2;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px #0008}.paper{width:38px;height:38px;border-radius:11px;background:#c39d76;color:#4b3527;display:grid;place-items:center;font-size:20px}.who{flex:1;font-size:12px}.who small{display:block;color:#aeb8c5;margin-top:3px}.incoming button{border:0;border-radius:9px;padding:8px 10px;color:#fff}.ignore{background:#485364}.accept{background:#2eaf78}.floating{position:absolute;z-index:7;right:0;top:180px;width:42px;height:86px;border-radius:18px 0 0 18px;background:#c39d76;color:#4b3527;display:none;place-items:center;font-size:24px}.locked .dialog,.locked .controls{display:none}.locked .hero{inset:120px 0 100px}.choices{position:absolute;z-index:6;left:16px;right:16px;bottom:145px;display:none;gap:8px}.choices button{border:1px solid #e2c98d99;color:#fff;background:#221f22dd;border-radius:10px;padding:11px;text-align:left}</style><div class="phone locked" id="phone"><div class="scene"></div><div class="top"><button onclick="incoming()">‹</button><span id="state">来电 · 心纸君</span><button onclick="lockView()">⋮</button></div><div class="incoming" id="incoming"><div class="paper">项</div><div class="who"><b>项羽</b><small>心纸君传音 · 正在呼叫</small></div><button class="ignore" onclick="ignoreCall()">忽略</button><button class="accept" onclick="acceptCall()">接听</button></div><div class="floating" id="floating" onclick="restoreCall()">项</div><div class="mini">我<small>本地画面</small></div><div class="hero"><div class="avatar">项</div><div class="name">项羽</div></div><div class="dialog"><div class="speaker">项羽</div><div class="line" id="line">“你说，人真的能回到过去吗？”</div><div class="hint">点击继续 · 2/8</div></div><div class="choices" id="choices"><button onclick="choose('我在听。')">我在听。</button><button onclick="choose('你那边发生了什么？')">你那边发生了什么？</button></div><div class="controls"><button class="ctrl" onclick="toggle(this)">⌕</button><button class="ctrl" onclick="toggle(this)">♩</button><button class="ctrl" onclick="toggle(this)">♬</button><button class="ctrl hang" onclick="hangup()">☎</button></div></div><script>const phone=document.querySelector('#phone'),panel=document.querySelector('#incoming'),float=document.querySelector('#floating'),state=document.querySelector('#state'),line=document.querySelector('#line'),choices=document.querySelector('#choices');function incoming(){phone.classList.add('locked');panel.style.display='flex';state.textContent='来电 · 心纸君'}function ignoreCall(){panel.style.display='none';float.style.display='grid';state.textContent='已收纳 · 点击右侧纸人恢复'}function restoreCall(){float.style.display='none';panel.style.display='flex'}function acceptCall(){panel.style.display='none';phone.classList.remove('locked');state.textContent='连线中 · 公元前202年'}function hangup(){phone.classList.add('locked');panel.style.display='flex';state.textContent='来电 · 心纸君'}function toggle(b){b.style.background='#2eaf78'}function lockView(){phone.classList.toggle('locked');state.textContent=phone.classList.contains('locked')?'纯净画面 · 双击恢复':'连线中 · 公元前202年'}function choose(t){line.textContent='我：“'+t+'”';choices.style.display='none'}phone.ondblclick=()=>{if(phone.classList.contains('locked')&&panel.style.display!=='flex'){phone.classList.remove('locked');state.textContent='连线中 · 公元前202年'}}incoming();</script>
