#e3c88d;border-radius:50%;font-size:65px;box-shadow:0 15px 38px #0008}.name{position:absolute;top:calc(50% + 88px);font-size:18px;letter-spacing:2px}.dialog{position:absolute;z-index:3;left:16px;right:16px;bottom:160px;padding:14px 16px;border:1px solid #fff4;border-radius:14px;background:#101722d9;backdrop-filter:blur(9px)}.speaker{font-size:12px;color:#e4c98d;margin-bottom:7px}.line{font-size:17px;line-height:1.65;min-height:55px}.progress{font-size:10px;color:#fff8;text-align:right;margin-top:7px}.controls{position:absolute;z-index:5;bottom:0;left:0;right:0;padding:15px 18px 22px;display:flex;justify-content:center;gap:18px;background:linear-gradient(transparent,#090e16 35%)}.ctrl{width:48px;height:48px;border-radius:50%;border:1px solid #fff6;background:#fff3;color:#fff;font-size:18px}.hang{background:#df4d51;border:0;width:60px;height:60px}.review{position:absolute;z-index:6;right:14px;top:52px;border:1px solid #fff5;border-radius:8px;padding:5px 7px;background:#10172280;color:#fff;font-size:11px}.reviewcard{display:none;position:absolute;z-index:8;inset:12% 8%;padding:20px;border-radius:16px;background:#f7f0df;color:#392f24;box-shadow:0 12px 40px #0008}.reviewcard h3{margin:0 0 12px;font-size:16px}.reviewcard p{font-size:13px;line-height:1.8}.reviewcard button{border:0;border-radius:8px;padding:8px 14px;background:#76583e;color:#fff}.floating{display:none;position:absolute;z-index:7;right:0;top:180px;width:42px;height:86px;border-radius:18px 0 0 18px;background:#c39d76;color:#4b3527;place-items:center;font-size:24px}

<div class="phone" id="phone"><section class="current"><div class="statusbar"><span>09:41</span><span>● ● ▪</span></div><div class="wechat-head">微信 <span style="float:right;font-size:25px">＋</span></div><div class="search">⌕ 搜索历史人物 / 聊天记录</div><div class="chatrow"><div class="face">项</div><div class="rowtext"><b>项羽</b><small>新消息 · 心纸君传音</small></div></div><div class="chatrow"><div class="face" style="background:#bdc8d0">苏</div><div class="rowtext"><b>苏轼</b><small>人生如逆旅，我亦是行人。</small></div></div></section><div class="incoming" id="incoming"><div class="face">项</div><div class="who"><b>项羽</b><small>心纸君传音 · 正在呼叫</small></div><button class="ignore" onclick="ignoreCall()">忽略</button><button class="accept" onclick="acceptCall()">接听</button></div><div class="floating" id="floating" onclick="restoreCall()">项</div><section class="call" id="call"><div class="shade"></div><div class="calltop"><button onclick="hangup()">‹</button><span id="callstate">连线中 · 前202年</span><button class="auto" onclick="toggleAuto()" id="auto">自动播放：开</button></div><button class="review" onclick="review()">回顾剧情</button><div class="hero"><div class="face">项</div><div class="name">项羽</div></div><div class="dialog"><div class="speaker">项羽</div><div class="line" id="line">“殿下，真的……能听见吗？”</div><div class="progress" id="progress">点击继续 · 1 / 6</div></div><div class="controls"><button class="ctrl" onclick="mute(this)">♩</button><button class="ctrl" onclick="speaker(this)">⌕</button><button class="ctrl" onclick="nextLine()">›</button><button class="ctrl hang" onclick="hangup()">☎</button></div><div class="reviewcard" id="reviewcard"><h3>剧情回顾 · 项羽</h3><p>项羽确认心纸君能够传音。你们谈到回到过去、江东与未竟的约定。</p><p>已播放：1 / 6<br>可重新收听已解锁台词。</p><button onclick="reviewClose()">返回通话</button></div></section></div>
<script>
const incoming=document.querySelector('#incoming'),floating=document.querySelector('#floating'),call=document.querySelector('#call'),line=document.querySelector('#line'),progress=document.querySelector('#progress'),reviewcard=document.querySelector('#reviewcard');let i=0,auto=true;const lines=['“殿下，真的……能听见吗？”','“真是神奇，竟有能传音的纸人。”','我：“只要使用心纸君，我们就能随时通话了。”','“你那边一切还好吗？城门口也有动静……”','我：“我们准备离开这里，回广陵。”','“好。此去路远，望殿下小心。”'];
function ignoreCall(){incoming.style.display='none';floating.style.display='grid'}function restoreCall(){floating.style.display='none';incoming.style.display='flex'}function acceptCall(){incoming.style.display='none';call.style.display='block'}function hangup(){call.style.display='none';incoming.style.display='flex';reviewcard.style.display='none'}function nextLine(){if(i<lines.length-1)i++;line.textContent=lines[i];progress.textContent='点击继续 · '+(i+1)+' / '+lines.length}function toggleAuto(){auto=!auto;document.querySelector('#auto').textContent='自动播放：'+(auto?'开':'关')}function mute(b){b.textContent=b.textContent==='♩'?'🔇':'♩';b.style.background='#2eaf78'}function speaker(b){b.style.background='#2eaf78'}function review(){reviewcard.style.display='block'}function reviewClose(){reviewcard.style.display='none'}incoming.style.display='flex';
</script>
